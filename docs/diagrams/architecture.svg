<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title description">
  <title id="title">Idempotent Background Transaction Processing architecture</title>
  <desc id="description">Architecture and processing flow for the Java Spring Boot transaction service.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#52627a"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .small { font-size: 13px; }
      .muted { fill: #52627a; font-size: 12px; }
      .box { fill: #f4f7fb; stroke: #718198; stroke-width: 1.5; rx: 9; }
      .container { fill: #fff; stroke: #8292a8; stroke-width: 1.5; rx: 12; }
      .store { fill: #edf5ff; stroke: #4a6f9c; stroke-width: 1.5; }
      .note { fill: #fff8df; stroke: #d3a93d; stroke-width: 1.2; rx: 8; }
      .line { fill: none; stroke: #52627a; stroke-width: 1.7; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #718198; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="920" fill="#f3f6fb"/>
  <text x="40" y="46" class="title">Idempotent Background Transaction Processing</text>

  <text x="40" y="90" class="section">Runtime architecture</text>
  <rect x="250" y="112" width="665" height="330" class="container"/>
  <text x="275" y="140" class="label">Spring Boot application</text>

  <rect x="45" y="205" width="155" height="76" class="box"/>
  <text x="122" y="235" text-anchor="middle" class="label">Client / browser</text>
  <text x="122" y="258" text-anchor="middle" class="small">human or API caller</text>

  <rect x="295" y="170" width="245" height="78" class="box"/>
  <text x="417" y="198" text-anchor="middle" class="label">Static browser UI</text>
  <text x="417" y="221" text-anchor="middle" class="small">index.html · fetch API</text>

  <rect x="620" y="170" width="245" height="78" class="box"/>
  <text x="742" y="198" text-anchor="middle" class="label">REST API</text>
  <text x="742" y="221" text-anchor="middle" class="small">TransactionController</text>

  <rect x="365" y="310" width="300" height="92" class="box"/>
  <text x="515" y="340" text-anchor="middle" class="label">TransactionProcessor</text>
  <text x="515" y="364" text-anchor="middle" class="small">validation · idempotency · ordering</text>
  <text x="515" y="384" text-anchor="middle" class="small">retry policy · balance updates</text>

  <rect x="720" y="310" width="165" height="92" class="box"/>
  <text x="802" y="340" text-anchor="middle" class="label">Worker pool</text>
  <text x="802" y="364" text-anchor="middle" class="small">2 background threads</text>

  <path d="M200 225 L285 210" class="line"/>
  <text x="224" y="199" class="muted">open UI</text>
  <path d="M200 258 C300 300 500 285 610 230" class="line"/>
  <text x="375" y="277" class="muted">HTTP requests</text>
  <path d="M540 209 L610 209" class="line"/>
  <text x="550" y="193" class="muted">fetch</text>
  <path d="M742 250 L595 300" class="line"/>
  <text x="684" y="279" class="muted">delegate</text>
  <path d="M666 355 L710 355" class="line"/>
  <text x="668" y="339" class="muted">schedule</text>
  <path d="M720 384 L675 384" class="dashed"/>
  <text x="674" y="421" class="muted">process account</text>

  <path d="M365 356 L255 356 L255 495 L325 495" class="line"/>
  <text x="74" y="480" class="muted">state changes</text>
  <path d="M665 335 L950 335 L950 495 L875 495" class="dashed"/>
  <text x="898" y="320" class="muted">lifecycle events</text>

  <path d="M325 466 L875 466 L875 536 L325 536 Z" class="store"/>
  <text x="600" y="489" text-anchor="middle" class="label">In-memory state</text>
  <text x="600" y="512" text-anchor="middle" class="small">transaction / request maps · sequence slots / cursors · account and currency balances</text>

  <rect x="945" y="462" width="205" height="74" class="box"/>
  <text x="1047" y="491" text-anchor="middle" class="label">SLF4J event logs</text>
  <text x="1047" y="514" text-anchor="middle" class="small">IDs and lifecycle events</text>

  <rect x="45" y="565" width="1105" height="80" class="note"/>
  <text x="65" y="592" class="label">Runtime behavior</text>
  <text x="65" y="616" class="small">Sequences are ordered per account; duplicates do not reapply balance effects; transient failures retry up to 3 times per run.</text>
  <text x="65" y="638" class="small">Spring Boot Actuator exposes a minimal health status at /actuator/health.</text>

  <text x="40" y="690" class="section">Processing flow</text>
  <rect x="45" y="713" width="1110" height="155" class="container"/>

  <rect x="72" y="753" width="145" height="66" class="box"/>
  <text x="144" y="780" text-anchor="middle" class="label">1. Receive</text>
  <text x="144" y="802" text-anchor="middle" class="small">HTTP / batch</text>

  <rect x="272" y="753" width="165" height="66" class="box"/>
  <text x="354" y="780" text-anchor="middle" class="label">2. Validate</text>
  <text x="354" y="802" text-anchor="middle" class="small">reject bad records</text>

  <rect x="492" y="753" width="185" height="66" class="box"/>
  <text x="584" y="780" text-anchor="middle" class="label">3. Deduplicate</text>
  <text x="584" y="802" text-anchor="middle" class="small">transaction / request ID</text>

  <rect x="732" y="753" width="180" height="66" class="box"/>
  <text x="822" y="780" text-anchor="middle" class="label">4. Order</text>
  <text x="822" y="802" text-anchor="middle" class="small">wait for sequence</text>

  <rect x="967" y="753" width="160" height="66" class="box"/>
  <text x="1047" y="780" text-anchor="middle" class="label">5. Apply</text>
  <text x="1047" y="802" text-anchor="middle" class="small">retry then update</text>

  <path d="M217 786 L262 786" class="line"/>
  <path d="M437 786 L482 786" class="line"/>
  <path d="M677 786 L722 786" class="line"/>
  <path d="M912 786 L957 786" class="line"/>
</svg>
